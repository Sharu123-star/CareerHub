<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerHub | Forgot Password</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            CareerHub
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="internships.html">Internships</a>

            <a href="index.html#about">About</a>

            <a href="login.html">Login</a>

            <a href="Register.html" class="register-btn">
                Register
            </a>

        </div>

    </nav>


    <!-- Forgot Password -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>
                Forgot Password?
            </h1>

            <p>
                Enter your registered email address
                to reset your password.
            </p>


            <form id="forgotPasswordForm">

                <!-- Email -->
                <label for="forgotEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- New Password -->
                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >


                <!-- Confirm Password -->
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >


                <!-- Reset Button -->
                <button
                    type="submit"
                    class="primary-btn">

                    Reset Password

                </button>

            </form>


            <!-- Login -->
            <div class="auth-link">

                <span>
                    Remember your password?
                </span>

                <a
                    href="login.html"
                    style="cursor: pointer;">

                    Login

                </a>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
