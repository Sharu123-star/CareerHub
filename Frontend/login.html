<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerHub | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            CareerHub
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="Register.html" class="register-btn">
                Register
            </a>

        </div>

    </nav>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>
                Welcome Back 👋
            </h1>

            <p>
                Login to your CareerHub account
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- Forgot Password -->
                <a
                    href="forgot-password.html"
                    class="forgot-password"
                >
                    Forgot Password?
                </a>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <p class="auth-link">

                Don't have an account?

                <a href="Register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
