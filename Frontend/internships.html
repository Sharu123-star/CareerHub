<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerHub | Internships</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            CareerHub
        </div>

        <div class="nav-links">

            <a href="dashboard.html">Dashboard</a>

            <a href="profile.html">Profile</a>

            <a href="skills.html">Skills</a>

            <a href="projects.html">Projects</a>

            <a href="certifications.html">Certifications</a>

            <a href="internships.html">Internships</a>

            <a href="#" id="logoutBtn">Logout</a>

        </div>

    </nav>


    <!-- Internships Section -->
    <section class="internships-section">

        <div class="internships-card">

            <h1>Internship Opportunities 💼</h1>

            <p class="internships-subtitle">
                Explore internship opportunities and find the right one for you.
            </p>


            <!-- Search -->
            <div class="internship-search">

                <input
                    type="text"
                    id="internshipSearch"
                    placeholder="Search by company, title, skill or location..."
                >

            </div>


            <!-- Internship List -->
            <div class="internships-list">

                <h2>Available Internships</h2>

                <div id="internshipsContainer">

                    <p>Loading internships...</p>

                </div>

            </div>


            <!-- Back -->
            <a
                href="dashboard.html"
                class="primary-btn internships-back"
            >
                Back to Dashboard
            </a>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
